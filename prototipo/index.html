<style>
/* VOICE: sobrio, institucional; herramienta de trabajo para tutores y áreas de apoyo
   IDEA: el expediente/folio de canalización como hoja técnica con su historial
   PICTURE: la herramienta misma (bandeja, folio con su ciclo de estados)
   COLOUR and TYPE: franja cobalto, blanco, tinta negra, zonas #eef2ff; Space Grotesk + Inter
   LAYOUT: franja de título, navegación por rol, panel de trabajo; una columna bajo 600px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#10131c,#e8ebf5);--mut:light-dark(#566079,#9aa4bd);--line:light-dark(#d9deea,#262c40);--zone:light-dark(#eef2ff,#121831);--co:#1240e0;--co2:light-dark(#1240e0,#7d9bff);--ok:light-dark(#137a3a,#5fd38c);--bad:light-dark(#b3261e,#ff8a80);--warn:light-dark(#8a5a00,#f2c14e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:24px}h3{font-size:17px}
a{color:var(--co2)}
.strip{background:var(--co);color:#fff;padding:12px max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.strip b{font-family:"Space Grotesk";font-size:20px;letter-spacing:.02em}
.strip .who{margin-inline-start:auto;font-size:14px;opacity:.95}
.strip button{background:transparent;color:#fff;border:1px solid #ffffff99}
.note{background:var(--zone);padding:8px max(4vw,16px);font-size:13px;color:var(--mut)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px max(4vw,16px);border-bottom:1px solid var(--line)}
nav button{flex:none;border:0;background:transparent;color:var(--ink);border-radius:8px}
nav button[aria-current=page]{background:var(--zone);color:var(--co2);font-weight:600}
main{padding:20px max(4vw,16px) 48px;max-width:1240px}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:14px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.inc-Mínimo{color:var(--co2)}.inc-Segundo{color:var(--warn)}.inc-Tercero{color:var(--mut)}
.st{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap;background:var(--zone)}
.st-Registrada{color:#5b3fd6}.st-Recibida{color:var(--co2)}.st-En{color:#0b7d8c}.st-No{color:var(--bad)}.st-Atendida{color:var(--ok)}.st-Escalada{color:var(--warn)}.st-Cerrada{color:var(--mut)}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.pri{background:var(--co);color:#fff;border-color:var(--co)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7d9bff;outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px 28px;align-items:start}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px}
.zone{background:var(--zone);border-radius:12px;padding:14px 16px}
.mut{color:var(--mut);font-size:14px}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:15px;border-inline-start:4px solid}
.flash.ok{border-color:var(--ok);background:var(--zone)}.flash.bad{border-color:var(--bad);background:var(--zone)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--zone)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:start;display:block;width:100%;min-height:auto}
.card .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:15px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.big{font-family:"Space Grotesk";font-size:clamp(30px,5vw,44px);line-height:1}
.bar{height:10px;border-radius:5px;background:var(--co)}
.login{max-width:980px}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px;margin:16px 0}
.acc button{text-align:start;padding:12px 14px}.acc small{display:block;color:var(--mut);font-size:13px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px 10px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.chk label{margin:0;font-weight:400;display:flex;gap:6px;align-items:center;min-height:32px}.chk input{width:auto}
.scroll{overflow-x:auto}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.strip .who{margin-inline-start:0;width:100%}}
@media print{.strip,nav,.note,.noprint{display:none}main{padding:0}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

    { id: 'JEF_CARRERA', nombre: 'Jefatura de carrera', rol: 'jefatura' },
    { id: 'COORD', nombre: 'Coordinación de tutoría', rol: 'coord' },
    { id: 'ADMIN', nombre: 'Administrador', rol: 'admin' }
  ];
  const ROLES = { tutor: 'Tutor', apoyo: 'Área de apoyo', jefatura: 'Jefatura de carrera', coord: 'Coordinación de tutoría', admin: 'Administrador' };
  const INSTANCIAS = ['Psicología', 'Desarrollo Académico'];
  const MOTIVOS = ['inasistencia', 'bajo rendimiento', 'conducta', 'solicitud del estudiante'];
  const EJES = ['académico', 'personal', 'profesional'];
  const SIN_DATO = 'Sin dato en el Anexo E';

  function semilla(DATA) {
    return {
      tutorados: DATA.tutorados.map(t => ({ ...t })),
      sesiones: DATA.sesiones.map(s => ({ ...s, fuente: 'Anexo E' })),
      canalizaciones: DATA.canalizaciones.map(c => ({
        ...c, motivo: null, informado: null, descripcion: 'Descripción sintética de prueba', fuente: 'Anexo E'
      })),
      cambios: DATA.cambios.map((c, i) => ({ id: i + 1, ...c, observacion: '', fuente: 'Anexo E' })),
      notas: [],
      notificaciones: [],
      bitacora: [],
      seq: 0
    };
  }

  const usuario = id => USUARIOS.find(u => u.id === id);
  const ahora = () => FECHA_REF + ' ' + new Date().toTimeString().slice(0, 8);
  const res = (ok, codigo, mensaje, extra) => ({ ok, codigo, mensaje, ...extra });

  function bit(st, u, accion, entidad, idRegistro) {
    st.seq += 1;
    st.bitacora.push({ id: st.seq, usuario: u.id, fecha: ahora(), accion, entidad, registro: idRegistro });
  }

  // Control de acceso (RNF-02): ¿puede el usuario ver u operar este folio?
  function puedeVerFolio(u, c) {
    if (u.rol === 'tutor') return c.tutor === u.id;
    if (u.rol === 'apoyo') return c.instancia === u.instancia;
    return u.rol === 'jefatura' || u.rol === 'coord';
  }
  // RN-05: solo el tutor y la instancia de destino ven el detalle confidencial
  function veDetalle(u, c) {
    return (u.rol === 'tutor' && c.tutor === u.id) || (u.rol === 'apoyo' && c.instancia === u.instancia);
  }

  function transicionesDisponibles(u, c) {
    return TRANSICIONES.filter(t => t.o === c.estado && t.rol === u.rol);
  }

  // D05: cambio de estado
  function cambiarEstado(st, uid, folio, destino, observacion, motivo) {
    const u = usuario(uid);
    const c = st.canalizaciones.find(x => x.folio === folio);
    if (!c) return res(false, 'NO_EXISTE', 'El folio no existe.');
    if (!puedeVerFolio(u, c) || u.rol === 'admin') {
      bit(st, u, 'Intento denegado de cambio de estado', 'Canalizacion', folio);
      return res(false, 'DENEGADO', 'Acceso denegado: el folio no corresponde a su rol o instancia (RNF-02).');
    }
    const t = TRANSICIONES.find(x => x.o === c.estado && x.d === destino && x.rol === u.rol);
    if (!t) return res(false, 'NO_PERMITIDA', `Transición no permitida: «${c.estado}» → «${destino}» para ${ROLES[u.rol].toLowerCase()} (RF-06, Tabla VI). No se registró ningún cambio.`);
    if (t.inc !== 'Mínimo') return res(false, 'INCREMENTO', `Transición especificada para el ${t.inc.toLowerCase()} incremento (RF-08); no está implementada en este prototipo.`);
    if (t.motivo && !(motivo || '').trim()) return res(false, 'MOTIVO', 'Para cerrar sin atención se requiere un motivo de cierre (RN-04).');
    if (!(observacion || '').trim()) return res(false, 'OBSERVACION', 'No se registró el cambio: escriba una observación (RF-06: cada cambio guarda usuario, fecha y observación).');
    if ((observacion || '').length > 300) return res(false, 'VALIDACION', 'La observación admite hasta 300 caracteres.');
    // operación atómica: estado + CambioEstado + Bitácora
    const origen = c.estado;
    c.estado = destino;
    st.cambios.push({ id: st.cambios.length + 1, folio, origen, destino, usuario: u.id, fecha: ahora(), observacion: [observacion, motivo ? 'Motivo de cierre: ' + motivo : ''].filter(Boolean).join(' · '), fuente: 'Prueba' });
    bit(st, u, `Cambio de estado ${origen} → ${destino}`, 'Canalizacion', folio);
    // RF-09 (segundo incremento): notificación al tutor
    if (u.id !== c.tutor) st.notificaciones.push({ para: c.tutor, folio, estado: destino, fecha: ahora(), leida: false });
    return res(true, 'OK', `Folio ${folio}: «${origen}» → «${destino}».`);
  }

  function siguienteFolio(st) {
    const n = Math.max(...st.canalizaciones.map(c => +c.folio.slice(-4))) + 1;
    return 'CAN-2026-' + String(n).padStart(4, '0');
  }

  // RF-05, RN-03, RN-09, RNF-04
  function registrarCanalizacion(st, uid, f) {
    const u = usuario(uid);
    if (u.rol !== 'tutor') return res(false, 'DENEGADO', 'Solo el tutor registra canalizaciones (RN-03).');
    const nc = (f.nc || '').trim().toUpperCase();
    const t = st.tutorados.find(x => x.nc === nc);
    if (!t) return res(false, 'VALIDACION', 'El número de control no existe en el conjunto de tutorados.');
    if (t.tutor !== u.id) {
      bit(st, u, 'Intento denegado de canalización', 'Tutorado', nc);
      return res(false, 'DENEGADO', `Rechazada: ${nc} no pertenece a su grupo. Solo el tutor del estudiante registra su canalización (RN-03).`);
    }
    const faltan = [];
    if (!f.motivo) faltan.push('motivo de detección');
    if (!f.instancia) faltan.push('instancia de destino');
    if (!f.prioridad) faltan.push('prioridad');
    if (f.informado !== true && f.informado !== false) faltan.push('si el estudiante fue informado');
    if (!(f.descripcion || '').trim()) faltan.push('descripción breve');
    if (faltan.length) return res(false, 'VALIDACION', 'No se guardó. Falta: ' + faltan.join(', ') + '.');
    if (f.descripcion.length > 500) return res(false, 'VALIDACION', 'La descripción excede 500 caracteres (RNF-04).');
    const folio = siguienteFolio(st);
    st.canalizaciones.push({ folio, nc, tutor: u.id, instancia: f.instancia, prioridad: f.prioridad, fecha: FECHA_REF, estado: 'Registrada', motivo: f.motivo, informado: f.informado, descripcion: f.descripcion.trim(), fuente: 'Prueba' });
    st.cambios.push({ id: st.cambios.length + 1, folio, origen: '—', destino: 'Registrada', usuario: u.id, fecha: ahora(), observacion: 'Registro de la canalización', fuente: 'Prueba' });
    bit(st, u, 'Registro de canalización', 'Canalizacion', folio);
    return res(true, 'OK', `Canalización registrada con folio ${folio}, estado «Registrada».`, { folio });
  }

  // RF-03
  function registrarNota(st, uid, nc, eje, texto) {
    const u = usuario(uid);
    const t = st.tutorados.find(x => x.nc === nc);
    if (!t || u.rol !== 'tutor' || t.tutor !== u.id) return res(false, 'DENEGADO', 'Acceso denegado (RNF-02).');
    if (!eje) return res(false, 'VALIDACION', 'No se guardó: seleccione el eje (RF-03).');
    if (!(texto || '').trim()) return res(false, 'VALIDACION', 'No se guardó: escriba el contenido de la nota.');
    if (texto.length > 1000) return res(false, 'VALIDACION', 'La nota admite hasta 1000 caracteres.');
    const id = 'NOT-' + String(st.notas.length + 1).padStart(3, '0');
    st.notas.push({ id, nc, eje, texto: texto.trim(), autor: u.id, fecha: ahora() });
    bit(st, u, 'Registro de nota de seguimiento', 'NotaSeguimiento', id);
    return res(true, 'OK', 'Nota guardada.');
  }

  // RF-04
  function registrarSesion(st, uid, f) {
    const u = usuario(uid);
    if (u.rol !== 'tutor') return res(false, 'DENEGADO', 'Acceso denegado.');
    const faltan = [];
    if (!f.tipo) faltan.push('tipo');
    if (!f.fecha) faltan.push('fecha');
    if (!(f.tema || '').trim()) faltan.push('tema');
    if (f.tipo === 'individual' && !(f.acuerdos || '').trim()) faltan.push('acuerdos (obligatorios en sesión individual)');
    const asis = f.asistentes || [];
    if (!asis.length) faltan.push('asistentes');
    if (faltan.length) return res(false, 'VALIDACION', 'No se guardó. Falta: ' + faltan.join(', ') + '.');
    if (f.tipo === 'individual' && asis.length !== 1) return res(false, 'VALIDACION', 'Una sesión individual tiene exactamente un asistente.');
    if (asis.some(nc => (st.tutorados.find(t => t.nc === nc) || {}).tutor !== u.id)) return res(false, 'VALIDACION', 'Los asistentes deben ser del grupo del tutor.');
    if ((f.tema || '').length > 150 || (f.acuerdos || '').length > 500) return res(false, 'VALIDACION', 'Tema hasta 150 y acuerdos hasta 500 caracteres.');
    const n = st.sesiones.filter(s => s.tutor === u.id).length + 1;
    const id = `SES-${u.id}-P${n}`;
    st.sesiones.push({ id, tutor: u.id, grupo: u.grupo, fecha: f.fecha, tipo: f.tipo, asistentes: asis.length, lista: asis, tema: f.tema.trim(), acuerdos: (f.acuerdos || '').trim(), fuente: 'Prueba' });
    bit(st, u, 'Registro de sesión', 'Sesion', id);
    return res(true, 'OK', `Sesión ${id} registrada con ${asis.length} asistente(s).`);
  }

  function verExpediente(st, uid, nc) {
    const u = usuario(uid);
    const t = st.tutorados.find(x => x.nc === nc);
    if (!t || u.rol !== 'tutor' || t.tutor !== u.id) return null;
    bit(st, u, 'Consulta de expediente', 'Tutorado', nc);
    return t;
  }

  // Días hábiles (lunes a viernes) en (desde, hasta]
  function diasHabiles(desde, hasta) {
    const a = new Date(desde.slice(0, 10) + 'T12:00:00Z'), b = new Date(hasta.slice(0, 10) + 'T12:00:00Z');
    let n = 0;
    for (let d = new Date(a.getTime() + 864e5); d <= b; d = new Date(d.getTime() + 864e5)) {
      const w = d.getUTCDay(); if (w !== 0 && w !== 6) n++;
    }
    return n;
  }

  // Estado de un folio a una fecha, reconstruido desde CambioEstado
  function estadoAl(st, folio, fecha) {
    const cs = st.cambios.filter(c => c.folio === folio && c.fecha.slice(0, 10) <= fecha);
    return cs.length ? { estado: cs[cs.length - 1].destino, ultimo: cs[cs.length - 1].fecha.slice(0, 10) } : null;
  }

  function historial(st, folio) { return st.cambios.filter(c => c.folio === folio); }

  // RF-10, RN-07
  function alertas(st, fecha = FECHA_REF, N = N_ALERTA) {
    return st.canalizaciones.map(c => {
      const e = estadoAl(st, c.folio, fecha);
      if (!e || !['Registrada', 'Recibida'].includes(e.estado)) return null;
      const dias = diasHabiles(e.ultimo, fecha);
      return dias > N ? { folio: c.folio, tutor: c.tutor, instancia: c.instancia, estado: e.estado, ultimo: e.ultimo, dias } : null;
    }).filter(Boolean);
  }

  // RF-11
  function informe(st, tutor, corte = FECHA_REF) {
    const u = usuario(tutor);
    const ses = st.sesiones.filter(s => s.tutor === tutor && s.fecha <= corte);
    const can = st.canalizaciones.filter(c => c.tutor === tutor && c.fecha <= corte);
    const porEstado = {};
    can.forEach(c => { const e = estadoAl(st, c.folio, corte); if (e) porEstado[e.estado] = (porEstado[e.estado] || 0) + 1; });
    return {
      tutor, grupo: u.grupo, corte,
      tutorados: st.tutorados.filter(t => t.tutor === tutor).length,
      grupales: ses.filter(s => s.tipo === 'grupal').length,
      individuales: ses.filter(s => s.tipo === 'individual').length,
      asistencias: ses.reduce((a, s) => a + (+s.asistentes || 0), 0),
      notas: st.notas.filter(n => n.autor === tutor && n.fecha.slice(0, 10) <= corte).length,
      canalizaciones: can.length, porEstado,
      alertas: alertas(st, corte).filter(a => a.tutor === tutor).length,
      sesiones: ses
    };
  }

  // RN-05: vista de la coordinación (sin descripción, motivo ni número de control)
  function vistaCoordinacion(st, fecha = FECHA_REF) {
    return st.canalizaciones.map(c => {
      const h = historial(st, c.folio); const ult = h[h.length - 1];
      return { folio: c.folio, grupo: (usuario(c.tutor) || {}).grupo, instancia: c.instancia, prioridad: c.prioridad, fecha: c.fecha, estado: c.estado, ultimo: ult.fecha.slice(0, 10), dias: diasHabiles(ult.fecha, fecha) };
    });
  }

  // RF-12 (tercer incremento): indicadores agregados por grupo
  function tablero(st) {
    const grupos = USUARIOS.filter(u => u.rol === 'tutor');
    return grupos.map(g => {
      const can = st.canalizaciones.filter(c => c.tutor === g.id);
      const porEstado = {}; can.forEach(c => porEstado[c.estado] = (porEstado[c.estado] || 0) + 1);
      const tiempos = can.map(c => {
        const h = historial(st, c.folio); const reg = h.find(x => x.destino === 'Registrada'); const at = h.find(x => x.destino === 'Atendida');
        return reg && at ? diasHabiles(reg.fecha, at.fecha) : null;
      }).filter(x => x !== null);
      return { grupo: g.grupo, tutor: g.id, porEstado, total: can.length, promedio: tiempos.length ? tiempos.reduce((a, b) => a + b, 0) / tiempos.length : null, nAtendidas: tiempos.length, sesiones: st.sesiones.filter(s => s.tutor === g.id).length };
    });
  }

  return { FECHA_REF, N_ALERTA, ESTADOS, TRANSICIONES, USUARIOS, ROLES, INSTANCIAS, MOTIVOS, EJES, SIN_DATO,
    semilla, usuario, puedeVerFolio, veDetalle, transicionesDisponibles, cambiarEstado, registrarCanalizacion,
    registrarNota, registrarSesion, verExpediente, diasHabiles, estadoAl, historial, alertas, informe,
    vistaCoordinacion, tablero };
})();

</script>
<script>{
const O = OHTLI;
const KEY = 'ohtli-prototipo-p4-v02';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = f => { const [y, m, d] = String(f).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const stc = e => `<span class="st st-${esc(e.split(' ')[0])}">${esc(e)}</span>`;
const inc = (rf, i) => `<span class="chip inc-${i}">${esc(rf)} · ${i === 'Mínimo' ? 'incremento mínimo' : i.toLowerCase() + ' incremento'}</span>`;
const $ = id => document.getElementById(id);

let S, U = null, view = null, sel = null, flash = null, ultimo = Date.now();
function cargar() {
  try { const t = localStorage.getItem(KEY); if (t) { S = JSON.parse(t); return; } } catch (e) {}
  S = O.semilla(DATA);
}
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
cargar();

const MENUS = {
  tutor: [['tutorados', 'Tutorados'], ['sesiones', 'Sesiones'], ['canal', 'Canalizaciones'], ['informe', 'Informe'], ['notif', 'Notificaciones']],
  apoyo: [['bandeja', 'Bandeja']],
  jefatura: [['jef', 'Canalizaciones']],
  coord: [['folios', 'Estado por folio'], ['alertas', 'Alertas'], ['tablero', 'Tablero']],
  admin: [['bitacora', 'Bitácora'], ['catalogos', 'Catálogos'], ['yolia', 'Yolia']]
};
const u = () => O.usuario(U);
function ir(v, s) { view = v; sel = s ?? null; render(); window.scrollTo(0, 0); }
function msg(r) { flash = r; }
function act(r) { msg(r); guardar(); render(); }

function render() {
  const app = $('app');
  if (!U) { app.innerHTML = login(); return; }
  const me = u(); const noLeidas = S.notificaciones.filter(n => n.para === me.id && !n.leida).length;
  app.innerHTML = `
  <header class="strip"><b>OHTLI</b><span>Prototipo navegable v0.2</span>
    <span class="who">${esc(me.nombre)} · ${esc(O.ROLES[me.rol])}${me.instancia ? ' · ' + esc(me.instancia) : ''}</span>
    <button data-a="salir">Salir</button></header>
  <div class="note">Modelo navegable del diseño (P3), no el sistema construido. Datos sintéticos del Anexo E (semilla 20261118, prefijo SIN). Fecha simulada del sistema: ${fmt(O.FECHA_REF)}.</div>
  <nav>${MENUS[me.rol].map(([k, t]) => `<button data-v="${k}" ${view === k || (view === 'exp' && k === 'tutorados') || (view === 'folio' && ['canal', 'bandeja', 'jef', 'folios'].includes(k)) ? 'aria-current="page"' : ''}>${t}${k === 'notif' && noLeidas ? ` (${noLeidas})` : ''}</button>`).join('')}</nav>
  <main>${flash ? `<div class="flash ${flash.ok ? 'ok' : 'bad'}" role="status">${esc(flash.mensaje)}</div>` : ''}${vista()}</main>`;
  flash = null;
}

function login() {
  const grupos = ['tutor', 'apoyo', 'jefatura', 'coord', 'admin'];
  return `<header class="strip"><b>OHTLI</b><span>Sistema Integral de Tutoría y Acompañamiento Estudiantil</span></header>
  <main class="login">
    <h1>Prototipo navegable v0.2</h1>
    <p>Seguimiento tutorial y canalización del Instituto Tecnológico Superior de Coatzacoalcos (ITESCO), como complemento de SIGEA. Este prototipo materializa los modelos de diseño de P3 (casos de uso, clases, máquina de estados, actividad y secuencia) para validar en P4 los escenarios ESC-01 a ESC-08.</p>
    <div class="zone mut">Datos sintéticos del Anexo E de P2 V4: 3 tutores, 120 tutorados, 27 sesiones, 15 canalizaciones y 42 cambios de estado. No corresponden a personas reales. Fecha simulada: ${fmt(O.FECHA_REF)}. Las cuentas no usan contraseña: el hash con sal y la expiración de sesión (RNF-01) pertenecen a la construcción; aquí la sesión se cierra tras 15 minutos sin actividad.</div>
    <h2 style="margin-top:22px">Elija una cuenta de prueba</h2>
    <div class="acc">${grupos.map(r => O.USUARIOS.filter(x => x.rol === r).map(x => `<button data-login="${x.id}"><b>${esc(x.nombre)}</b><small>${esc(O.ROLES[r])}${x.grupo ? ' · grupo ' + esc(x.grupo) : ''}${x.instancia ? ' · ' + esc(x.instancia) : ''}</small></button>`).join('')).join('')}</div>
    <div class="row"><button data-a="reset">Restablecer datos sintéticos</button><span class="mut">Devuelve el prototipo al estado del Anexo E antes de cada corrida de pruebas.</span></div>
    <details style="margin-top:22px"><summary><b>Escenarios de prueba (Anexo E)</b></summary>
      <table class="stack" style="margin-top:10px"><thead><tr><th>ID</th><th>Escenario</th><th>Procedimiento</th><th>Resultado esperado</th><th>Incremento</th></tr></thead><tbody>
      ${DATA.escenarios.map(e => `<tr><td>${esc(e.id)}</td><td>${esc(e.nombre)}</td><td>${esc(e.proc)}</td><td>${esc(e.esperado)}</td><td>${esc(e.inc)}</td></tr>`).join('')}</tbody></table></details>
  </main>`;
}

function vista() {
  const me = u();
  switch (view) {
    case 'tutorados': return vTutorados(me);
    case 'exp': return vExpediente(me);
    case 'sesiones': return vSesiones(me);
    case 'canal': return vCanal(me);
    case 'nueva': return vNueva(me);
    case 'folio': return vFolio(me);
    case 'informe': return vInforme(me);
    case 'notif': return vNotif(me);
    case 'bandeja': return vBandeja(me);
    case 'jef': return vJef(me);
    case 'folios': return vFolios(me);
    case 'alertas': return vAlertas(me);
    case 'tablero': return vTablero(me);
    case 'bitacora': return vBitacora(me);
    case 'catalogos': return vCatalogos(me);
    case 'yolia': return vYolia(me);
  }
  return '';
}

/* ---------- Tutor ---------- */
function vTutorados(me) {
  const ts = S.tutorados.filter(t => t.tutor === me.id);
  return `<div class="head"><h2>Tutorados del grupo ${esc(me.grupo)}</h2>${inc('RF-02', 'Mínimo')}</div>
  <p class="mut">${ts.length} tutorados, ciclo vigente. Identificados por número de control (RN-06: los datos de la entrevista inicial se consultan en SIGEA; aquí se simulan, RES-01).</p>
  <table class="stack"><thead><tr><th>Número de control</th><th class="n">Notas</th><th class="n">Canalizaciones</th><th>Última canalización</th></tr></thead><tbody>
  ${ts.map(t => { const cs = S.canalizaciones.filter(c => c.nc === t.nc); return `<tr class="click" data-exp="${esc(t.nc)}"><td><a href="#" data-exp="${esc(t.nc)}">${esc(t.nc)}</a></td><td class="n">${S.notas.filter(n => n.nc === t.nc).length}</td><td class="n">${cs.length}</td><td>${cs.length ? stc(cs[cs.length - 1].estado) : ''}</td></tr>`; }).join('')}
  </tbody></table>`;
}

function vExpediente(me) {
  const t = S.tutorados.find(x => x.nc === sel);
  if (!t || t.tutor !== me.id) return '<p>Acceso denegado (RNF-02).</p>';
  const notas = S.notas.filter(n => n.nc === t.nc).slice().reverse();
  const cs = S.canalizaciones.filter(c => c.nc === t.nc);
  return `<div class="head"><button data-v="tutorados" class="noprint">← Tutorados</button><h2>Expediente ${esc(t.nc)}</h2>${inc('RF-03', 'Mínimo')}</div>
  <div class="grid2">
   <section class="panel"><h3>Nueva nota de seguimiento</h3>
    <label for="eje">Eje</label><select id="eje"><option value="">Seleccione…</option>${O.EJES.map(e => `<option>${e}</option>`).join('')}</select>
    <label for="ntexto">Contenido (sin diagnósticos clínicos)</label><textarea id="ntexto" maxlength="1000"></textarea>
    <div class="row" style="margin-top:10px"><button class="pri" data-a="nota">Guardar nota</button><span class="mut">Fecha y autor se registran automáticamente.</span></div>
   </section>

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  ultimo = Date.now();
  const b = e.target.closest('[data-login],[data-a],[data-v],[data-exp],[data-folio],[data-nueva],[data-tr],[data-band]');
  if (!b) return;
  if (b.tagName === 'A') e.preventDefault();
  const d = b.dataset;
  if (d.login) { U = d.login; const r = O.usuario(U).rol; ir(MENUS[r][0][0]); return; }
  if (d.v) { ir(d.v); return; }
  if (d.exp) { if (O.verExpediente(S, U, d.exp)) { guardar(); ir('exp', d.exp); } return; }
  if (d.folio) { ir('folio', d.folio); return; }
  if (d.nueva !== undefined) { ir('nueva', d.nueva); return; }
  if (d.band !== undefined) { ir('bandeja', d.band); return; }
  if (d.tr) { act(O.cambiarEstado(S, U, sel, d.tr, $('fobs')?.value || '', $('fmot')?.value || '')); return; }
  switch (d.a) {
    case 'salir': U = null; view = null; render(); break;
    case 'reset': S = O.semilla(DATA); guardar(); render(); break;
    case 'nota': { const r = O.registrarNota(S, U, sel, $('eje').value, $('ntexto').value); act(r); break; }
    case 'todos': document.querySelectorAll('[name=asis]').forEach(x => x.checked = true); break;
    case 'ninguno': document.querySelectorAll('[name=asis]').forEach(x => x.checked = false); break;
    case 'sesion': {
      const r = O.registrarSesion(S, U, { tipo: $('stipo').value, fecha: $('sfecha').value, tema: $('stema').value, acuerdos: $('sacu').value, asistentes: [...document.querySelectorAll('[name=asis]:checked')].map(x => x.value) });
      act(r); break;
    }
    case 'canalizar': {
      const inf = $('cinf').value;
      const r = O.registrarCanalizacion(S, U, { nc: $('cnc').value, motivo: $('cmot').value, instancia: $('cins').value, prioridad: $('cpri').value, informado: inf === 'si' ? true : inf === 'no' ? false : null, descripcion: $('cdes').value });
      if (r.ok) { guardar(); msg(r); ir('folio', r.folio); } else { const keep = ['cnc', 'cmot', 'cins', 'cpri', 'cinf', 'cdes'].map(k => $(k).value); act(r); ['cnc', 'cmot', 'cins', 'cpri', 'cinf', 'cdes'].forEach((k, i) => $(k).value = keep[i]); }
      break;
    }
    case 'trlibre': act(O.cambiarEstado(S, U, sel, $('fdest').value, $('fobs')?.value || '', $('fmot')?.value || '')); break;
    case 'corte': ir('informe', $('icorte').value || O.FECHA_REF); break;
    case 'alertas': ir('alertas', `${$('afecha').value || O.FECHA_REF}|${Math.max(1, +$('an').value || O.N_ALERTA)}`); break;
    case 'leer': S.notificaciones.forEach(n => { if (n.para === U) n.leida = true; }); guardar(); render(); break;
    case 'copiar': {
      const r = O.informe(S, U, sel || O.FECHA_REF);
      const txt = `Informe del tutor ${r.tutor}, grupo ${r.grupo}, corte ${fmt(r.corte)}\nTutorados: ${r.tutorados}\nSesiones grupales: ${r.grupales}\nSesiones individuales: ${r.individuales}\nNotas: ${r.notas}\nCanalizaciones: ${r.canalizaciones}\n` + Object.entries(r.porEstado).map(([k, v]) => `  ${k}: ${v}`).join('\n') + `\nAlertas: ${r.alertas}\n(Datos sintéticos, Anexo E)`;
      navigator.clipboard.writeText(txt).then(() => { b.textContent = 'Copiado'; }, () => { b.textContent = 'No se pudo copiar'; });
      break;
    }
  }
});
document.addEventListener('input', e => {
  ultimo = Date.now();
  if (e.target.id === 'cdes') { const n = e.target.value.length; const c = $('ccount'); c.textContent = `${n} / 500`; c.style.color = n > 500 ? 'var(--bad)' : ''; }
});
setInterval(() => { if (U && Date.now() - ultimo > 15 * 60 * 1000) { U = null; view = null; flash = null; render(); } }, 30000);
render();
}
</script>
</body>
